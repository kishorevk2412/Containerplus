name: ContainerPulse CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Application Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest app/test_app.py -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false # Set to true when DOCKERHUB secrets are configured
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/containerpulse:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/containerpulse:${{ github.sha }}

  deploy-k8s:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
        continue-on-error: true

      - name: Apply Kubernetes Manifests
        run: |
          echo "Applying ConfigMap, Deployment, and Service..."
          # kubectl apply -f k8s/configmap.yaml
          # kubectl apply -f k8s/deployment.yaml
          # kubectl apply -f k8s/service.yaml
          # kubectl rollout status deployment/containerpulse-deployment
