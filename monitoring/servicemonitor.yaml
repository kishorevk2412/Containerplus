apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: containerpulse-servicemonitor
  namespace: monitoring
  labels:
    app: containerpulse
    release: prometheus
spec:
  selector:
    matchLabels:
      app: containerpulse
  namespaceSelector:
    matchNames:
      - default
  endpoints:
  - port: http
    path: /metrics
    interval: 5s
