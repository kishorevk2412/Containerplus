apiVersion: v1
kind: Service
metadata:
  name: containerpulse-service
  labels:
    app: containerpulse
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  type: NodePort
  selector:
    app: containerpulse
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30080
